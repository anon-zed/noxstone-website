<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Static Form Test</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 48px;
      }

      form {
        max-width: 640px;
      }

      label {
        display: block;
        margin-bottom: 16px;
      }

      input,
      textarea {
        display: block;
        width: 100%;
        box-sizing: border-box;
        margin-top: 6px;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <form>
      <label>
        Name
        <input name="name" type="text" />
      </label>
      <label>
        Phone
        <input name="phone" type="text" />
      </label>
      <label>
        Email
        <input name="email" type="text" />
      </label>
      <label>
        Property address
        <input name="property_address" type="text" />
      </label>
      <label>
        Project details
        <textarea name="project_details" rows="5"></textarea>
      </label>
      <button type="button">No-op button</button>
    </form>
  </body>
</html>
